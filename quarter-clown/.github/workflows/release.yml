# Baut die Windows-App (QuarterClown-Setup.exe) und veröffentlicht sie als GitHub-Release.
# Auslösen: Tag pushen (z. B. v1.0.0) oder manuell unter "Actions → Release → Run workflow".
# Repo-Variable QC_SERVER_URL (Settings → Secrets and variables → Actions → Variables) =
# Adresse deines Quarter-Clown-Servers, z. B. https://quarterclown.example.ch
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (z. B. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Version bestimmen
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q

      - name: Server-Adresse einbauen
        shell: bash
        env:
          QC_SERVER_URL: ${{ vars.QC_SERVER_URL }}
          QC_VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$QC_SERVER_URL" ]; then echo "::error::Repo-Variable QC_SERVER_URL fehlt"; exit 1; fi
          python - <<'PY'
          import os, re, pathlib
          pathlib.Path("quarter_clown/_build.py").write_text(
              f'SERVER_URL = {os.environ["QC_SERVER_URL"].rstrip("/")!r}\n', encoding="utf-8")
          init = pathlib.Path("quarter_clown/__init__.py")
          init.write_text(re.sub(r'__version__ = ".*"', f'__version__ = "{os.environ["QC_VERSION"]}"', init.read_text()))
          PY

      - name: App bauen (PyInstaller)
        run: pyinstaller packaging/quarter_clown.spec --noconfirm --distpath dist --workpath build

      - name: Kurztest der gebauten App
        shell: bash
        run: |
          timeout 120 ./dist/QuarterClown/QuarterClown.exe --test --headless --blocks 1 --local
          ls "$LOCALAPPDATA/QuarterClown/output/test"

      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" packaging\installer.iss

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Quarter Clown ${{ steps.v.outputs.version }}
          files: dist/QuarterClown-Setup.exe
          body: |
            **Installieren:** `QuarterClown-Setup.exe` herunterladen und doppelklicken.
            Falls Windows warnt („Der Computer wurde durch Windows geschützt“): *Weitere Informationen* → *Trotzdem ausführen*.
