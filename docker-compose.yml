# Lokale Entwicklungsumgebung.
# Startet nur die Datenbank – Portal und API laufen direkt auf deinem Rechner (pnpm dev).
#
#   Starten:  pnpm db:up
#   Stoppen:  pnpm db:down
#
# Achtung: Diese Zugangsdaten sind absichtlich simpel und gelten NUR lokal.
# Auf dem Server werden sie durch echte Secrets aus der .env-Datei ersetzt.

services:
  postgres:
    image: postgres:17-alpine
    container_name: webheaven-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: webheaven
      POSTGRES_PASSWORD: webheaven_dev_only
      POSTGRES_DB: webheaven
    ports:
      # Nur auf dem eigenen Rechner erreichbar, nicht im Netzwerk.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U webheaven -d webheaven']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
