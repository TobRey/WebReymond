name: BlockRave (Minecraft-Mod)

# Baut die NeoForge-Mod, fuehrt die Kern-Unit-Tests aus und startet einen echten dedizierten
# GameTest-Server (ohne Grafik/Audio), der die Buehnen-Tests ausfuehrt.
on:
  push:
    paths:
      - 'blockrave/**'
      - '.github/workflows/blockrave.yml'
  pull_request:
    paths:
      - 'blockrave/**'
      - '.github/workflows/blockrave.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, Tests, dedizierter Server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: blockrave
    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: Java 21 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Kern-Tests (ohne Minecraft)
        run: ./gradlew -p core-check test --no-daemon --console=plain

      - name: Mod bauen und testen
        run: ./gradlew build --no-daemon --console=plain

      - name: Dedizierter GameTest-Server
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon --console=plain 2>&1 | tee gametest.log

      - name: Client-Rauchtest (echter Client, Xvfb, Software-OpenGL)
        if: always()
        env:
          ALSOFT_DRIVERS: 'null'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils >/dev/null
          set -o pipefail
          timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientSmokeTest --no-daemon --console=plain 2>&1 | tee client.log

      - name: Mod-JAR hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockrave-mod
          path: blockrave/build/libs/*.jar
          if-no-files-found: warn

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blockrave-reports
          path: |
            blockrave/build/reports/
            blockrave/core-check/build/reports/
            blockrave/runs/gameTestServer/logs/
          if-no-files-found: ignore

      - name: Zusammenfassung GameTests
        if: always()
        run: |
          if [ -f gametest.log ]; then
            grep -aE "BlockRave|blockrave|GameTest|game test|tests? (passed|failed)|Exception|AssertionException|ERROR" gametest.log \
              | grep -avE "DEBUG|Registering|REGISTRIES" | tail -60
          fi

      - name: Zusammenfassung Client-Rauchtest
        if: always()
        run: |
          if [ -f client.log ]; then
            grep -aE "BlockRave-Smoke|Exception|ERROR|FATAL|OpenGL|Renderer" client.log | grep -avE "DEBUG|Failed to load properties" | tail -60
          fi
          pip install -q pillow >/dev/null 2>&1 || true
          for f in runs/clientSmokeTest/screenshots/blockrave_*.png; do
            [ -f "$f" ] || continue
            python3 -c "import sys,base64,io;from PIL import Image;im=Image.open(sys.argv[1]).convert('RGB');im.thumbnail((256,144));b=io.BytesIO();im.save(b,'JPEG',quality=70);print('IMG',sys.argv[1].split('/')[-1],base64.b64encode(b.getvalue()).decode())" "$f"
          done
