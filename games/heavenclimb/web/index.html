<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="HeavenClimb – ein Pixel-Art-Jump-'n'-Run. Klettere so hoch du kannst, mit Doppelsprung und Wandsprung."
    />
    <title>HeavenClimb</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230f172a'/%3E%3Crect x='5' y='3' width='6' height='5' fill='%23cbd5e1'/%3E%3Crect x='6' y='4' width='4' height='2' fill='%2322d3ee'/%3E%3Crect x='5' y='8' width='6' height='5' fill='%232563eb'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="shell">
      <header class="bar">
        <h1 class="brand" data-i18n="app.title">HeavenClimb</h1>
        <div class="bar__tools">
          <div class="langswitch" role="group" data-i18n-attr="aria-label:menu.langLabel">
            <button type="button" class="langswitch__btn" data-lang="de">DE</button>
            <button type="button" class="langswitch__btn" data-lang="en">EN</button>
          </div>
          <button type="button" class="iconbtn" id="mute" data-i18n="misc.muteOn">Ton aus</button>
        </div>
      </header>

      <main class="layout">
        <!-- stagewrap gibt den verfügbaren Platz vor, stage schmiegt sich an
             den ganzzahlig vergrösserten Canvas an. Ohne diese Trennung müsste
             der Canvas in einen fest geformten Kasten passen und bliebe fast
             immer eine Vergrösserungsstufe unter dem Möglichen. -->
        <div class="stagewrap" id="stagewrap">
          <div class="stage" id="stage">
            <canvas id="screen" width="240" height="320" aria-label="HeavenClimb"></canvas>

            <div class="hud" id="hud" hidden>
              <div class="hud__row">
                <span class="hud__label" data-i18n="hud.height">Höhe</span>
                <span class="hud__value" id="hudHeight">0 m</span>
              </div>
              <div class="hud__row">
                <span class="hud__label" data-i18n="hud.gems">Edelsteine</span>
                <span class="hud__value" id="hudGems">0</span>
              </div>
              <div class="hud__row hud__row--dim">
                <span class="hud__label" data-i18n="hud.best">Rekord</span>
                <span class="hud__value" id="hudBest">0</span>
              </div>
              <div class="pressure" aria-hidden="true"><i id="pressureFill"></i></div>
            </div>

            <div class="touch" id="touch" hidden>
              <div class="touch__side">
                <button type="button" class="touch__btn" id="tLeft" aria-label="←">◀</button>
                <button type="button" class="touch__btn" id="tRight" aria-label="→">▶</button>
              </div>
              <div class="touch__side touch__side--right">
                <button type="button" class="touch__btn" id="tDown" aria-label="↓">▼</button>
                <button
                  type="button"
                  class="touch__btn touch__btn--jump"
                  id="tJump"
                  aria-label="Jump"
                >
                  ▲
                </button>
              </div>
            </div>

            <div class="overlay" id="overlay">
              <section class="panel" id="panelMenu">
                <p class="panel__tag" data-i18n="app.tagline">Klettere so hoch du kannst.</p>
                <label class="field">
                  <span class="field__label" data-i18n="menu.nameLabel">Dein Name</span>
                  <input
                    type="text"
                    id="playerName"
                    maxlength="12"
                    autocomplete="nickname"
                    spellcheck="false"
                    data-i18n-attr="placeholder:menu.namePlaceholder"
                  />
                </label>
                <button type="button" class="btn btn--primary" id="btnStart" data-i18n="menu.start">
                  Spiel starten
                </button>
              </section>

              <section class="panel" id="panelPause" hidden>
                <h2 class="panel__title" data-i18n="pause.title">Pause</h2>
                <button
                  type="button"
                  class="btn btn--primary"
                  id="btnResume"
                  data-i18n="pause.resume"
                >
                  Weiter
                </button>
                <button type="button" class="btn" id="btnRestartPause" data-i18n="pause.restart">
                  Neu starten
                </button>
                <button
                  type="button"
                  class="btn btn--ghost"
                  id="btnMenuPause"
                  data-i18n="pause.menu"
                >
                  Zum Menü
                </button>
              </section>

              <section class="panel" id="panelOver" hidden>
                <h2 class="panel__title" data-i18n="over.title">Vorbei</h2>
                <p class="panel__best" id="overBest" hidden data-i18n="over.newBest"></p>
                <dl class="result">
                  <div class="result__row">
                    <dt data-i18n="over.height">Höhe</dt>
                    <dd id="overHeight">0 m</dd>
                  </div>
                  <div class="result__row">
                    <dt data-i18n="over.gems">Edelsteine</dt>
                    <dd id="overGems">0</dd>
                  </div>
                  <div class="result__row result__row--total">
                    <dt data-i18n="over.score">Punkte</dt>
                    <dd id="overScore">0</dd>
                  </div>
                </dl>
                <p class="panel__status" id="overStatus"></p>
                <button type="button" class="btn btn--primary" id="btnRetry" data-i18n="over.retry">
                  Nochmal
                </button>
                <button type="button" class="btn btn--ghost" id="btnMenuOver" data-i18n="over.menu">
                  Zum Menü
                </button>
              </section>
            </div>
          </div>
        </div>

        <aside class="side">
          <section class="card">
            <h2 class="card__title" data-i18n="menu.leaderboardTitle">Bestenliste</h2>
            <p class="badge" id="boardBadge">
              <span class="badge__dot" id="boardDot"></span>
              <span id="boardMode" data-i18n="board.loading">Wird geladen …</span>
            </p>
            <p class="card__hint" id="boardHint" hidden data-i18n="board.localHint"></p>
            <ol class="board" id="board"></ol>
            <p class="card__note" data-i18n="board.forgeable"></p>
            <button
              type="button"
              class="btn btn--ghost btn--small"
              id="btnReload"
              data-i18n="board.reload"
            >
              Neu laden
            </button>
          </section>

          <section class="card">
            <h2 class="card__title" data-i18n="menu.controlsTitle">Steuerung</h2>
            <dl class="keys">
              <div class="keys__row">
                <dt data-i18n="controls.move">Laufen</dt>
                <dd data-i18n="controls.moveKeys"></dd>
              </div>
              <div class="keys__row">
                <dt data-i18n="controls.jump">Springen</dt>
                <dd data-i18n="controls.jumpKeys"></dd>
              </div>
              <div class="keys__row">
                <dt data-i18n="controls.double">Doppelsprung</dt>
                <dd data-i18n="controls.doubleKeys"></dd>
              </div>
              <div class="keys__row">
                <dt data-i18n="controls.wall">Wandsprung</dt>
                <dd data-i18n="controls.wallKeys"></dd>
              </div>
              <div class="keys__row">
                <dt data-i18n="controls.drop">Durchfallen</dt>
                <dd data-i18n="controls.dropKeys"></dd>
              </div>
              <div class="keys__row">
                <dt data-i18n="controls.pause">Pause</dt>
                <dd data-i18n="controls.pauseKeys"></dd>
              </div>
              <div class="keys__row">
                <dt data-i18n="controls.restart">Neu starten</dt>
                <dd data-i18n="controls.restartKeys"></dd>
              </div>
              <div class="keys__row">
                <dt data-i18n="controls.mute">Ton aus</dt>
                <dd data-i18n="controls.muteKeys"></dd>
              </div>
            </dl>
            <p class="card__note" data-i18n="controls.touch"></p>
            <p class="card__note" data-i18n="controls.pad"></p>
          </section>
        </aside>
      </main>

      <footer class="foot">
        <span>HeavenClimb</span>
        <span id="version"></span>
      </footer>
    </div>

    <noscript>
      <p style="padding: 1rem; color: #e2e8f0">
        HeavenClimb braucht JavaScript. · HeavenClimb needs JavaScript.
      </p>
    </noscript>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
