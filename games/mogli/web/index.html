<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050a09" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Mogli – Tempelflucht. Ein Pixel-Art-Jump-'n'-Run mit genau einem Knopf: tippen zum Springen, an der Wand abstossen, so hoch wie möglich."
    />
    <title>Mogli – Tempelflucht</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d1a16'/%3E%3Crect x='5' y='2' width='6' height='4' fill='%234a2a16'/%3E%3Crect x='5' y='6' width='6' height='4' fill='%23c07a42'/%3E%3Crect x='6' y='7' width='1' height='1' fill='%23060d0c'/%3E%3Crect x='9' y='7' width='1' height='1' fill='%23060d0c'/%3E%3Crect x='5' y='10' width='6' height='2' fill='%23c3281c'/%3E%3Crect x='6' y='12' width='1' height='3' fill='%23c07a42'/%3E%3Crect x='9' y='12' width='1' height='3' fill='%23c07a42'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!--
      Der Meldungsstreifen. Er ist leer und unsichtbar, solange nichts schiefgeht.

      Er steht VOR allem anderen im Dokument, damit er auch dann noch da ist,
      wenn das Spiel selbst nie startet: der Menübildschirm darunter ist
      statisches HTML und sähe sonst völlig normal aus, obwohl kein einziger
      Knopf verdrahtet wurde.
    -->
    <div class="crash" id="crash" hidden>
      <p class="crash__head">Mogli konnte nicht starten</p>
      <div class="crash__list"></div>
      <p class="crash__hint">
        Bitte diesen Text abschreiben oder abfotografieren und schicken. Meist hilft schon: alle
        Dateien neu hochladen und dann hier neu laden.
      </p>
      <button type="button" class="crash__btn" id="crashReload">Neu laden</button>
    </div>

    <!--
      Der Fänger. Er steht bewusst hier drin und nicht in einem Modul.

      Ein Modul, das gar nicht erst ausgeführt wird – Datei fehlt, unvollständig
      hochgeladen, vom Server mit falschem Typ ausgeliefert, ein Syntaxfehler –,
      kann sich unmöglich selbst darüber beschweren. Genau dieser Fall sieht auf
      dem Bildschirm aus wie ein kaputter Startknopf: das Menü darunter ist
      statisches HTML und steht ganz normal da.

      Also sammelt dieses Skript ab der ersten Zeile alles ein. Ist die Seite
      fertig geladen und das Spiel meldet sich trotzdem nicht als bedienbar,
      zeigt es selbst, was es hat. Läuft alles, war es nie zu sehen.
    -->
    <script>
      window.mogliBoot = {
        ok: false,
        errors: [],
        note: function (text) {
          this.errors.push(String(text));
          if (typeof this.onError === 'function') this.onError(String(text));
        },
      };
      window.addEventListener(
        'error',
        function (event) {
          var target = event.target;
          if (target && target !== window && target.src) {
            window.mogliBoot.note('Datei nicht ladbar: ' + String(target.src).split('/').pop());
            return;
          }
          var file = event.filename ? String(event.filename).split('/').pop() : '';
          window.mogliBoot.note(
            event.message + (file ? ' (' + file + ':' + event.lineno + ')' : ''),
          );
        },
        true,
      );
      window.addEventListener('unhandledrejection', function (event) {
        window.mogliBoot.note(event.reason);
      });
      // „Neu laden" muss auch dann gehen, wenn kein einziges Modul lief – also
      // hier. location.reload() holte die Seite oft aus demselben
      // Zwischenspeicher, der das Problem verursacht hat; eine neue Adresse
      // kann der Browser nicht zwischengespeichert haben.
      document.getElementById('crashReload').addEventListener('click', function () {
        window.location.href = window.location.pathname + '?neu=' + Date.now();
      });
      // Der Wachhund. Er wartet auf 'load' und nicht auf eine feste Frist ab
      // dem Seitenanfang: sonst schlägt er bei langsamer Verbindung an, während
      // in Wahrheit nur noch geladen wird. Nach 'load' ist alles da, was kommen
      // sollte – wenn sich das Spiel dann anderthalb Sekunden später immer noch
      // nicht gemeldet hat, ist wirklich etwas kaputt.
      window.addEventListener('load', function () {
        window.setTimeout(check, 1500);
      });
      function check() {
        if (window.mogliBoot.ok) return;
        var box = document.getElementById('crash');
        var list = box.querySelector('.crash__list');
        var lines = window.mogliBoot.errors.slice(0, 4);
        if (lines.length === 0) {
          lines = [
            'Das Spiel wurde nicht ausgeführt. Meist fehlt der Ordner "src" auf dem ' +
              'Webspace, ist unvollständig hochgeladen, oder der Server liefert .js-Dateien ' +
              'mit falschem Typ aus.',
          ];
        }
        for (var i = 0; i < lines.length; i += 1) {
          var line = document.createElement('p');
          line.className = 'crash__line';
          line.textContent = lines[i];
          list.appendChild(line);
        }
        box.hidden = false;
      }
    </script>

    <!--
      Das Spiel füllt den Bildschirm, sonst ist hier nichts. Alles andere –
      Bestenliste, Sprache, Ton – lebt in den Einblendungen darüber. So gibt es
      auf dem Handy keine Seite, an der man vorbeiscrollen kann.
    -->
    <div class="stage" id="stage">
      <canvas id="screen" width="256" height="336" aria-label="Mogli"></canvas>

      <div class="hud" id="hud" hidden>
        <div class="hud__row">
          <span
            class="hud__value hud__value--big"
            id="hudHeight"
            data-i18n-attr="aria-label:hud.height"
            >0 m</span
          >
          <span
            class="hud__value hud__value--gem"
            id="hudEmeralds"
            data-i18n-attr="aria-label:hud.emeralds"
            >0</span
          >
        </div>
        <div class="pressure" aria-hidden="true"><i id="pressureFill"></i></div>
      </div>

      <!-- Blendet sich nach dem ersten Sprung aus. -->
      <p class="taphint" id="tapHint" hidden>Tippen und los</p>

      <div class="overlay" id="overlay">
        <section class="panel" id="panelMenu">
          <h1 class="brand">
            <span class="brand__name" data-i18n="app.title">Mogli</span>
            <span class="brand__sub" data-i18n="app.subtitle">Tempelflucht</span>
          </h1>
          <p class="panel__tag" data-i18n="app.tagline">Ein Knopf. Immer nach oben.</p>

          <button
            type="button"
            class="btn btn--primary btn--big"
            id="btnStart"
            data-i18n="menu.start"
          >
            Los geht’s
          </button>

          <div class="board" id="boardMenu"></div>

          <label class="field">
            <span class="field__label" data-i18n="menu.nameLabel">Dein Name</span>
            <input
              type="text"
              id="playerName"
              maxlength="12"
              autocomplete="nickname"
              spellcheck="false"
              data-i18n-attr="placeholder:menu.namePlaceholder"
            />
          </label>

          <div class="tools">
            <div class="langswitch" role="group" data-i18n-attr="aria-label:menu.langLabel">
              <button type="button" class="langswitch__btn" data-lang="de">DE</button>
              <button type="button" class="langswitch__btn" data-lang="en">EN</button>
            </div>
            <button type="button" class="iconbtn" id="mute" data-i18n="misc.muteOn">Ton aus</button>
            <button type="button" class="iconbtn" id="full" data-i18n="misc.fullscreen">
              Vollbild
            </button>
            <button type="button" class="iconbtn" id="btnStory" data-i18n="menu.story">
              Geschichte
            </button>
          </div>

          <p class="panel__version" id="version"></p>
        </section>

        <section class="panel panel--story" id="panelStory" hidden>
          <div class="story">
            <canvas class="story__portrait" id="storyPortrait" width="24" height="24"></canvas>
            <div class="story__body">
              <p class="story__who" id="storyWho"></p>
              <p class="story__text" id="storyText"></p>
            </div>
          </div>
          <button
            type="button"
            class="btn btn--primary btn--big"
            id="btnStoryNext"
            data-i18n="story.next"
          >
            Weiter
          </button>
          <button type="button" class="btn btn--ghost" id="btnStorySkip" data-i18n="story.skip">
            Überspringen
          </button>
        </section>

        <section class="panel" id="panelPause" hidden>
          <h2 class="panel__title" data-i18n="pause.title">Pause</h2>
          <button
            type="button"
            class="btn btn--primary btn--big"
            id="btnResume"
            data-i18n="pause.resume"
          >
            Weiter
          </button>
          <button type="button" class="btn" id="btnRestartPause" data-i18n="pause.restart">
            Neu starten
          </button>
          <button type="button" class="btn btn--ghost" id="btnMenuPause" data-i18n="pause.menu">
            Zum Menü
          </button>
        </section>

        <section class="panel" id="panelOver" hidden>
          <h2 class="panel__title" data-i18n="over.title">Erwischt</h2>
          <p class="panel__best" id="overBest" hidden data-i18n="over.newBest"></p>
          <dl class="result">
            <div class="result__row">
              <dt data-i18n="over.height">Höhe</dt>
              <dd id="overHeight">0 m</dd>
            </div>
            <div class="result__row">
              <dt data-i18n="over.emeralds">Smaragde</dt>
              <dd id="overEmeralds">0</dd>
            </div>
            <div class="result__row">
              <dt data-i18n="hud.best">Rekord</dt>
              <dd id="overPersonal">0</dd>
            </div>
            <div class="result__row result__row--total">
              <dt data-i18n="over.score">Punkte</dt>
              <dd id="overScore">0</dd>
            </div>
          </dl>
          <p class="panel__status" id="overStatus"></p>
          <button
            type="button"
            class="btn btn--primary btn--big"
            id="btnRetry"
            data-i18n="over.retry"
          >
            Nochmal
          </button>
          <div class="board" id="boardOver"></div>
          <button type="button" class="btn btn--ghost" id="btnMenuOver" data-i18n="over.menu">
            Zum Menü
          </button>
        </section>
      </div>
    </div>

    <noscript>
      <p style="padding: 1rem; color: #dbe8cf">
        Mogli braucht JavaScript. · Mowgli needs JavaScript.
      </p>
    </noscript>

    <script type="module" src="src/main.js?v=2.0.2"></script>
  </body>
</html>
