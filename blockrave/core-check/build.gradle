plugins {
    id 'java'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java {
            srcDir '../src/main/java'
            include 'de/blockrave/core/**'
        }
    }
    test {
        java {
            srcDir '../src/test/java'
            include 'de/blockrave/core/**'
        }
        resources {
            srcDir '../src/test/resources'
        }
    }
}

// Optional: -PofflineLibs=<Ordner mit JARs> fuer Umgebungen ohne (zuverlaessigen) Maven-Central-Zugriff.
def offline = project.findProperty('offlineLibs')
if (offline) {
    repositories { flatDir { dirs offline } }
    dependencies {
        implementation name: 'concentus-1.0.2'
        implementation name: 'jlayer-1.0.1.4'
        implementation name: 'gson-2.10.1'
        testImplementation name: 'junit-jupiter-api-5.11.4'
        testImplementation name: 'opentest4j-1.3.0'
        testImplementation name: 'apiguardian-api-1.1.2'
        testImplementation name: 'junit-platform-commons-1.11.4'
        testRuntimeOnly name: 'junit-jupiter-engine-5.11.4'
        testRuntimeOnly name: 'junit-platform-engine-1.11.4'
        testRuntimeOnly name: 'junit-platform-launcher-1.11.4'
    }
} else {
    repositories { mavenCentral() }
    dependencies {
        implementation "io.github.jaredmdobson:concentus:1.0.2"
        implementation "com.googlecode.soundlibs:jlayer:1.0.1.4"
        implementation "com.google.code.gson:gson:2.10.1"
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
        showStandardStreams = true
        exceptionFormat "full"
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// ---------------------------------------------------------------------------
// Headless-Pruefstand fuer die Client-Audiowiedergabe (RavePlayer mit echtem OpenAL Soft,
// Ausgabe ueber dessen "wave"-Backend in eine Datei). Nur mit -PofflineLibs=<Ordner> nutzbar,
// der zusaetzlich lwjgl, lwjgl-openal (jeweils + natives-linux) und slf4j-api enthaelt.
if (offline) {
    sourceSets {
        harness {
            java {
                srcDir '../src/main/java'
                include 'de/blockrave/client/audio/RavePlayer.java', 'de/blockrave/harness/**'
                srcDir '../tools/harness'
            }
            compileClasspath += sourceSets.main.output + configurations.compileClasspath
            runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
        }
    }
    dependencies {
        harnessImplementation name: 'lwjgl-3.3.3'
        harnessImplementation name: 'lwjgl-openal-3.3.3'
        harnessImplementation name: 'slf4j-api-2.0.9'
        harnessRuntimeOnly name: 'lwjgl-3.3.3-natives-linux'
        harnessRuntimeOnly name: 'lwjgl-openal-3.3.3-natives-linux'
    }
    tasks.register('runAudioHarness', JavaExec) {
        classpath = sourceSets.harness.runtimeClasspath
        mainClass = 'de.blockrave.harness.AudioSyncHarness'
        def out = layout.buildDirectory.file('harness/out.wav').get().asFile
        def conf = layout.buildDirectory.file('harness/alsoft.ini').get().asFile
        args out.absolutePath
        environment 'ALSOFT_CONF', conf.absolutePath
        doFirst {
            conf.parentFile.mkdirs()
            out.delete()
            conf.text = "[general]\ndrivers=wave\nfrequency=48000\nchannels=stereo\nsample-type=int16\nperiod_size=480\n[wave]\nfile=${out.absolutePath}\n"
        }
    }
}
