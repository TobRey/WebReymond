plugins {
    id 'java'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java {
            srcDir '../src/main/java'
            include 'de/blockrave/core/**'
        }
    }
    test {
        java {
            srcDir '../src/test/java'
            include 'de/blockrave/core/**'
        }
        resources {
            srcDir '../src/test/resources'
        }
    }
}

// Optional: -PofflineLibs=<Ordner mit JARs> fuer Umgebungen ohne (zuverlaessigen) Maven-Central-Zugriff.
def offline = project.findProperty('offlineLibs')
if (offline) {
    repositories { flatDir { dirs offline } }
    dependencies {
        implementation name: 'concentus-1.0.2'
        implementation name: 'jlayer-1.0.1.4'
        implementation name: 'gson-2.10.1'
        testImplementation name: 'junit-jupiter-api-5.11.4'
        testImplementation name: 'opentest4j-1.3.0'
        testImplementation name: 'apiguardian-api-1.1.2'
        testImplementation name: 'junit-platform-commons-1.11.4'
        testRuntimeOnly name: 'junit-jupiter-engine-5.11.4'
        testRuntimeOnly name: 'junit-platform-engine-1.11.4'
        testRuntimeOnly name: 'junit-platform-launcher-1.11.4'
    }
} else {
    repositories { mavenCentral() }
    dependencies {
        implementation "io.github.jaredmdobson:concentus:1.0.2"
        implementation "com.googlecode.soundlibs:jlayer:1.0.1.4"
        implementation "com.google.code.gson:gson:2.10.1"
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
        showStandardStreams = true
        exceptionFormat "full"
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
