plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 laeuft mit Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def e2eDir = (project.findProperty('e2eDir') ?: project.file('runs/e2e').absolutePath).toString()
def e2eMp3 = (project.findProperty('e2eMp3') ?: project.file('src/test/resources/audio/techno128_44k.mp3').absolutePath).toString()

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Startet einen echten dedizierten GameTest-Server ohne Grafik/Audio,
        // fuehrt alle BlockRave-GameTests aus und beendet sich danach.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Automatischer Client-Rauchtest (CI: Xvfb + Software-OpenGL), siehe ClientSmokeTest
        clientSmokeTest {
            client()
            systemProperty 'blockrave.clientSmokeTest', 'true'
            programArguments.addAll '--username', 'BlockRaveTest'
        }
        // Mehrspieler-Ende-zu-Ende-Test: echte Clients gegen einen echten dedizierten Server (CI)
        e2eClientA {
            client()
            systemProperty 'blockrave.e2e', 'A'
            systemProperty 'blockrave.e2e.dir', e2eDir
            systemProperty 'blockrave.e2e.mp3', e2eMp3
            systemProperty 'blockrave.e2e.testTone', 'true'
            programArguments.addAll '--username', 'RaveDJ', '--quickPlayMultiplayer', 'localhost:25565'
            gameDirectory = project.file('runs/e2eA')
        }
        e2eClientB {
            client()
            systemProperty 'blockrave.e2e', 'B'
            systemProperty 'blockrave.e2e.dir', e2eDir
            programArguments.addAll '--username', 'RaveGast', '--quickPlayMultiplayer', 'localhost:25565'
            gameDirectory = project.file('runs/e2eB')
        }
        e2eClientA2 {
            client()
            systemProperty 'blockrave.e2e', 'A2'
            systemProperty 'blockrave.e2e.dir', e2eDir
            programArguments.addAll '--username', 'RaveDJ', '--quickPlayMultiplayer', 'localhost:25565'
            gameDirectory = project.file('runs/e2eA2')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Opus-Codec (reines Java, BSD-Lizenz) und MP3-Decoder JLayer (reines Java, LGPL 2.1).
    // Beide werden per Jar-in-Jar in die Mod-JAR eingebettet.
    jarJar(implementation("io.github.jaredmdobson:concentus:${concentus_version}"))
    jarJar(implementation("com.googlecode.soundlibs:jlayer:${jlayer_version}"))
    additionalRuntimeClasspath "io.github.jaredmdobson:concentus:${concentus_version}"
    additionalRuntimeClasspath "com.googlecode.soundlibs:jlayer:${jlayer_version}"

    // Gson liefert Minecraft zur Laufzeit; fuer die reinen Unit-Tests explizit
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events "failed"
        exceptionFormat "full"
        showStandardStreams = false
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

// Lizenztexte der eingebetteten Bibliotheken mitliefern.
tasks.named('jar') {
    from(rootProject.file('LICENSE')) { into 'META-INF' ; rename { 'LICENSE_blockrave' } }
    from(rootProject.file('docs/THIRD_PARTY_LICENSES.txt')) { into 'META-INF' }
}
