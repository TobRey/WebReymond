plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 laeuft mit Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Startet einen echten dedizierten GameTest-Server ohne Grafik/Audio,
        // fuehrt alle BlockRave-GameTests aus und beendet sich danach.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Opus-Codec (reines Java, BSD-Lizenz) und MP3-Decoder JLayer (reines Java, LGPL 2.1).
    // Beide werden per Jar-in-Jar in die Mod-JAR eingebettet.
    jarJar(implementation("io.github.jaredmdobson:concentus:${concentus_version}"))
    jarJar(implementation("com.googlecode.soundlibs:jlayer:${jlayer_version}"))
    additionalRuntimeClasspath "io.github.jaredmdobson:concentus:${concentus_version}"
    additionalRuntimeClasspath "com.googlecode.soundlibs:jlayer:${jlayer_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

// Lizenztexte der eingebetteten Bibliotheken mitliefern.
tasks.named('jar') {
    from(rootProject.file('LICENSE')) { into 'META-INF' ; rename { 'LICENSE_blockrave' } }
    from(rootProject.file('docs/THIRD_PARTY_LICENSES.txt')) { into 'META-INF' }
}
