<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820" role="img">
<defs>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".78"/></radialGradient>

</defs>
<rect width="1100" height="820" fill="#171410"/><g transform="translate(40,40) rotate(-2.5)"><rect width="440" height="330" fill="#ddd8c8" stroke="#b8b2a0" stroke-width="2"/><rect x="0" y="0" width="440" height="34" fill="#c9c3b2"/><text x="14" y="24" font-family="monospace" font-size="13" fill="#4a453c" text-anchor="start" letter-spacing="2" font-weight="normal">MILLBROOK SENTINEL · 2003</text><text x="14" y="72" font-family="Georgia, serif" font-size="19" fill="#221f1a" text-anchor="start" letter-spacing="0" font-weight="bold">Schuelerin seit Samstag vermisst</text><line x1="14" y1="86" x2="426" y2="86" stroke="#a49e8d"/><text x="14" y="116" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">MILLBROOK - Die 16-jaehrige Karen</text><text x="14" y="142" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">Pielmeier wurde nach dem Herbstfest</text><text x="14" y="168" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">zuletzt an der State Route 12 gesehen.</text><text x="14" y="194" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">Die Polizei bestaetigte Wartungs-</text><text x="14" y="220" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">arbeiten der Wasserwerke im Bereich</text><text x="14" y="246" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">Abschnitt 2 in derselben Nacht.</text><rect x="14" y="292" width="412" height="24" fill="#cdc7b6"/><text x="20" y="309" font-family="monospace" font-size="11" fill="#6b6658" text-anchor="start" letter-spacing="1" font-weight="normal">ARCHIV · MIKROFILM 2003</text></g><g transform="translate(560,90) rotate(1.8)"><rect width="440" height="330" fill="#ddd8c8" stroke="#b8b2a0" stroke-width="2"/><rect x="0" y="0" width="440" height="34" fill="#c9c3b2"/><text x="14" y="24" font-family="monospace" font-size="13" fill="#4a453c" text-anchor="start" letter-spacing="2" font-weight="normal">MILLBROOK SENTINEL · 2009</text><text x="14" y="72" font-family="Georgia, serif" font-size="19" fill="#221f1a" text-anchor="start" letter-spacing="0" font-weight="bold">Keine Spur von Danny Oro</text><line x1="14" y1="86" x2="426" y2="86" stroke="#a49e8d"/><text x="14" y="116" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">MILLBROOK - Der 17-jaehrige Danny Oro</text><text x="14" y="142" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">verschwand in der Nacht zum Sonntag.</text><text x="14" y="168" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">Sein Fahrrad wurde an der Ridge Road</text><text x="14" y="194" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">gefunden. Die Strasse war wegen einer</text><text x="14" y="220" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">Leitungsspuelung (Abschnitt 3) halb-</text><text x="14" y="246" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">seitig gesperrt.</text><rect x="14" y="292" width="412" height="24" fill="#cdc7b6"/><text x="20" y="309" font-family="monospace" font-size="11" fill="#6b6658" text-anchor="start" letter-spacing="1" font-weight="normal">ARCHIV · MIKROFILM 2009</text></g><g transform="translate(100,430) rotate(2.2)"><rect width="440" height="330" fill="#ddd8c8" stroke="#b8b2a0" stroke-width="2"/><rect x="0" y="0" width="440" height="34" fill="#c9c3b2"/><text x="14" y="24" font-family="monospace" font-size="13" fill="#4a453c" text-anchor="start" letter-spacing="2" font-weight="normal">MILLBROOK SENTINEL · 2015</text><text x="14" y="72" font-family="Georgia, serif" font-size="19" fill="#221f1a" text-anchor="start" letter-spacing="0" font-weight="bold">Suche nach Marisol Vance eingestellt</text><line x1="14" y1="86" x2="426" y2="86" stroke="#a49e8d"/><text x="14" y="116" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">MILLBROOK - Nach sieben Wochen stellt</text><text x="14" y="142" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">die Polizei die Suche ein. Ein Zeuge,</text><text x="14" y="168" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">Lehrer G. Hale, berichtete zunaechst</text><text x="14" y="194" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">von einem weissen Transporter, zog</text><text x="14" y="220" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">die Aussage aber zurueck. Abschnitt 5</text><text x="14" y="246" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">war in der Tatnacht gesperrt.</text><rect x="14" y="292" width="412" height="24" fill="#cdc7b6"/><text x="20" y="309" font-family="monospace" font-size="11" fill="#6b6658" text-anchor="start" letter-spacing="1" font-weight="normal">ARCHIV · MIKROFILM 2015</text></g><g transform="translate(620,470) rotate(-1.6)"><rect width="440" height="330" fill="#ddd8c8" stroke="#b8b2a0" stroke-width="2"/><rect x="0" y="0" width="440" height="34" fill="#c9c3b2"/><text x="14" y="24" font-family="monospace" font-size="13" fill="#4a453c" text-anchor="start" letter-spacing="2" font-weight="normal">MILLBROOK SENTINEL · 1998</text><text x="14" y="72" font-family="Georgia, serif" font-size="19" fill="#221f1a" text-anchor="start" letter-spacing="0" font-weight="bold">Pumpstation 4 geht vom Netz</text><line x1="14" y1="86" x2="426" y2="86" stroke="#a49e8d"/><text x="14" y="116" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">MILLBROOK - Die Stadt nimmt Pump-</text><text x="14" y="142" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">station 4 am Halloway-Stausee aus</text><text x="14" y="168" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">dem Betrieb. Betriebsleiter Walter</text><text x="14" y="194" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">Doss betont, die Anlage bleibe als</text><text x="14" y="220" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">Reserve erhalten und werde weiter</text><text x="14" y="246" font-family="monospace" font-size="13" fill="#3c3830" text-anchor="start" letter-spacing="0" font-weight="normal">gewartet.</text><rect x="14" y="292" width="412" height="24" fill="#cdc7b6"/><text x="20" y="309" font-family="monospace" font-size="11" fill="#6b6658" text-anchor="start" letter-spacing="1" font-weight="normal">ARCHIV · MIKROFILM 1998</text></g><rect x="0" y="0" width="1100" height="820" fill="#0d0b08" opacity=".12"/>
<rect width="1100" height="820" fill="url(#vig)"/>
<rect width="1100" height="820" filter="url(#grain)" opacity=".07"/>
</svg>